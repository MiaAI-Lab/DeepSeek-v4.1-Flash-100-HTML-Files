<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Optical Study 08 — a kinetic op-art poster made of rings, stripes and interference.">
<title>Optical Study 08 — Motion Is a Decision</title>
<style>
  html{overflow-x:hidden}
  :root{
    --paper:#f4f2ec; --ink:#0c0c0c; --red:#e33a24; --freq:16px; --rot:22deg; --scale:1;
    --sans:"Helvetica Neue","Arial Narrow",-apple-system,"Segoe UI",Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden;height:100svh}
  ::selection{background:var(--red);color:var(--paper)}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--red);outline-offset:4px}
  .mono{font-family:var(--mono);font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;line-height:1.7}
  .field{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--paper)}
  .rings{position:absolute;inset:-20%;background:repeating-radial-gradient(circle at 52% 48%,var(--ink) 0 calc(var(--freq)*.44),var(--paper) calc(var(--freq)*.44) var(--freq));
    transform:translate3d(var(--tx,0),var(--ty,0),0) scale(var(--scale));transition:transform .18s ease-out}
  .stripes{position:absolute;inset:-30%;background:repeating-linear-gradient(var(--rot),var(--ink) 0 2px,transparent 2px 9px);
    mix-blend-mode:difference;opacity:.95;transform:translate3d(var(--sx,0),var(--sy,0),0) rotate(var(--sr,0deg)) scale(1.08);
    animation:drift 26s linear infinite;transition:transform .25s ease-out}
  @keyframes drift{to{transform:translate3d(var(--sx,0),var(--sy,0),0) rotate(calc(var(--sr,0deg) + 360deg)) scale(1.08)}}
  .field.frozen .stripes{animation-play-state:paused}
  .field.inverted{filter:invert(1)}
  .top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding:16px clamp(16px,3.2vw,40px);mix-blend-mode:difference;color:#fff}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.68rem}
  .brand i{width:9px;height:9px;border-radius:50%;background:#fff;display:block}
  .topMeta{display:flex;gap:24px;text-align:right;line-height:1.8}
  .topMeta b{font-weight:400}
  .block{position:fixed;left:clamp(16px,3.2vw,44px);bottom:clamp(18px,4vh,44px);z-index:5;background:var(--ink);color:var(--paper);padding:clamp(14px,2vw,22px) clamp(16px,2.4vw,28px);max-width:min(760px,84vw);mix-blend-mode:normal}
  .block .idx{color:var(--red);margin-bottom:8px;display:flex;justify-content:space-between;gap:20px}
  h1{font-size:clamp(2.6rem,7.4vw,7.2rem);line-height:.82;letter-spacing:-.06em;font-weight:700;text-transform:uppercase}
  h1 span{display:block}
  h1 em{font-style:normal;color:transparent;-webkit-text-stroke:1px var(--paper)}
  .block .foot{display:flex;justify-content:space-between;gap:20px;margin-top:12px;padding-top:8px;border-top:1px solid rgba(244,242,236,.3);color:rgba(244,242,236,.6);flex-wrap:wrap}

  .controls{position:fixed;right:clamp(16px,3.2vw,40px);bottom:clamp(18px,4vh,44px);z-index:6;width:min(280px,calc(100vw - 32px));background:rgba(244,242,236,.92);border:1px solid var(--ink);padding:11px;backdrop-filter:blur(6px)}
  .ctlHead{display:flex;justify-content:space-between;color:rgba(12,12,12,.55);margin-bottom:7px}
  .ctlHead b{color:var(--ink);font-weight:400}
  input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:18px;background:transparent;cursor:ew-resize}
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--ink)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;background:var(--red);border:1px solid var(--ink);margin-top:-6px}
  input[type=range]::-moz-range-track{height:1px;background:var(--ink)}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--red);border:1px solid var(--ink)}
  .btns{display:flex;gap:5px;margin-top:8px}
  .btn{flex:1;border:1px solid var(--ink);padding:6px 5px;font-family:var(--mono);font-size:.4rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);transition:background .2s,color .2s}
  .btn:hover{background:var(--ink);color:var(--paper)}
  .btn[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--paper)}
  .corner{position:fixed;z-index:6;width:14px;height:14px;border-color:var(--ink);pointer-events:none}
  .c1{left:8px;top:8px;border-left:1px solid;border-top:1px solid}.c2{right:8px;top:8px;border-right:1px solid;border-top:1px solid}
  .c3{left:8px;bottom:8px;border-left:1px solid;border-bottom:1px solid}.c4{right:8px;bottom:8px;border-right:1px solid;border-bottom:1px solid}
  .side{position:fixed;right:clamp(16px,3.2vw,40px);top:50%;transform:translateY(-50%) rotate(90deg);transform-origin:right center;z-index:5;color:rgba(12,12,12,.55);white-space:nowrap;mix-blend-mode:difference;color:#fff}
  .clickNote{position:fixed;left:50%;top:16%;transform:translateX(-50%);z-index:5;color:rgba(12,12,12,.5);mix-blend-mode:difference;color:#fff;pointer-events:none}

  @media(max-width:900px){
    .side{display:none}
    .block{max-width:calc(100vw - 32px);right:16px}
    .controls{top:auto;bottom:calc(clamp(18px,4vh,44px) + 220px);right:16px;width:calc(100vw - 32px);max-width:300px}
    .block h1{font-size:clamp(2.4rem,10vw,4.4rem)}
  }
  @media(max-width:600px){
    .topMeta span:nth-child(2){display:none}
    .controls{top:92px;bottom:auto;width:190px}
    .block{padding:12px 14px;left:12px;right:12px;max-width:none}
    .controls .btns{gap:3px}
    .block .foot span:last-child{display:none}
    .clickNote{display:none}
    .block h1{font-size:12vw}
  }
  @media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="field" id="field">
  <div class="rings" id="rings"></div>
  <div class="stripes" id="stripes"></div>
</div>
<span class="corner c1" aria-hidden="true"></span><span class="corner c2" aria-hidden="true"></span><span class="corner c3" aria-hidden="true"></span><span class="corner c4" aria-hidden="true"></span>

<header class="top mono">
  <a class="brand" href="#"><i aria-hidden="true"></i>Optical Study 08</a>
  <div class="topMeta"><span>Interference field <b>— live</b></span><span>MMXXVI / edition 01</span></div>
</header>
<span class="side mono" aria-hidden="true">Move the eye · not the image</span>
<span class="clickNote mono" aria-hidden="true">Click to disturb the pattern</span>

<div class="block">
  <div class="idx mono"><span>Study 08 — moiré</span><span>Red / 01</span></div>
  <h1><span>Motion</span><span>is a <em>decision.</em></span></h1>
  <div class="foot mono"><span>Rings + stripes / difference blend</span><span>Optical poster, no image files</span></div>
</div>

<div class="controls">
  <div class="ctlHead mono"><span>Frequency</span><b id="freqOut">16 px</b></div>
  <input id="freq" type="range" min="8" max="34" value="16" aria-label="Pattern frequency">
  <div class="btns">
    <button class="btn" id="invert" aria-pressed="false">Invert</button>
    <button class="btn" id="freeze" aria-pressed="false">Freeze</button>
    <button class="btn" id="reset">Reset</button>
  </div>
</div>

<script>
  const field = document.getElementById('field');
  const rings = document.getElementById('rings');
  const stripes = document.getElementById('stripes');
  const freq = document.getElementById('freq');
  const freqOut = document.getElementById('freqOut');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let tx = 0, ty = 0, sx = 0, sy = 0, sr = 0;
  let ptx = 0, pty = 0;
  let frozen = reduce;

  let looping = false;
  function update(){
    rings.style.setProperty('--tx', tx.toFixed(2) + 'px');
    rings.style.setProperty('--ty', ty.toFixed(2) + 'px');
    rings.style.setProperty('--scale', (1 + Math.abs(ptx) * .0005).toFixed(3));
    stripes.style.setProperty('--sx', sx.toFixed(2) + 'px');
    stripes.style.setProperty('--sy', sy.toFixed(2) + 'px');
    stripes.style.setProperty('--sr', sr.toFixed(2) + 'deg');
    if (!reduce && !frozen && !looping){
      looping = true;
      requestAnimationFrame(function(){ looping = false; update(); });
    }
  }

  window.addEventListener('pointermove', e => {
    if (frozen && !reduce) return;
    ptx = (e.clientX / innerWidth - .5) * 60;
    pty = (e.clientY / innerHeight - .5) * 60;
    tx += (ptx - tx) * .06;
    ty += (pty - ty) * .06;
    sx += (-ptx * .8 - sx) * .06;
    sy += (-pty * 1.2 - sy) * .06;
    sr += (ptx * .25 - sr) * .06;
  }, { passive: true });

  document.addEventListener('click', e => {
    if (e.target.closest('button, input, a')) return;
    frozen = true;
    field.classList.add('frozen');
    sr += 9;
    update();
    setTimeout(() => {
      if (freezeBtn.getAttribute('aria-pressed') !== 'true'){
        frozen = false;
        field.classList.remove('frozen');
        update();
      }
    }, 420);
  });

  freq.addEventListener('input', () => {
    document.documentElement.style.setProperty('--freq', freq.value + 'px');
    document.documentElement.style.setProperty('--rot', (freq.value * 1.4) + 'deg');
    freqOut.textContent = freq.value + ' px';
  });

  const invertBtn = document.getElementById('invert');
  invertBtn.addEventListener('click', () => {
    const on = field.classList.toggle('inverted');
    invertBtn.setAttribute('aria-pressed', String(on));
  });

  const freezeBtn = document.getElementById('freeze');
  function setFrozen(on){
    frozen = on;
    field.classList.toggle('frozen', on);
    freezeBtn.setAttribute('aria-pressed', String(on));
    freezeBtn.textContent = on ? 'Resume' : 'Freeze';
    if (!on && !reduce) update();
  }
  freezeBtn.addEventListener('click', () => setFrozen(!frozen));

  document.getElementById('reset').addEventListener('click', () => {
    tx = ty = sx = sy = sr = 0;
    freq.value = 16;
    document.documentElement.style.setProperty('--freq', '16px');
    document.documentElement.style.setProperty('--rot', '22deg');
    freqOut.textContent = '16 px';
    field.classList.remove('inverted');
    invertBtn.setAttribute('aria-pressed', 'false');
    setFrozen(false);
    update();
  });

  if (reduce) setFrozen(true);
  update();
</script>
</body>
</html>
