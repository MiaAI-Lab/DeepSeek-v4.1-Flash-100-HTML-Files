<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a1a1e">
  <meta name="description" content="Lanterns 073 — a wish released onto the water.">
  <title>Lanterns 073 — A Wish Released onto the Water</title>
  <style>
    :root {
      --night: #06171c;
      --deep: #0b2a30;
      --water: #0e3038;
      --amber: #f0ad58;
      --gold: #ffd79a;
      --cream: #f4ecd9;
      --dim: #87a0a2;
      --line: rgba(244,236,217,.18);
      --serif: Georgia, "Times New Roman", serif;
      --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
      --mono: "Courier New", Courier, monospace;
    }
    * { box-sizing: border-box; }
    ::selection { background: var(--amber); color: var(--night); }
    html, body { margin: 0; height: 100%; }
    body { background: var(--night); color: var(--cream); font-family: var(--sans); overflow: hidden; }
    .scene { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(180deg, #041217 0%, #0a2429 38%, #12333a 62%, #0a2429 100%); }
    .moon { position: absolute; right: 12%; top: 12%; width: 8vmin; height: 8vmin; border-radius: 50%; background: radial-gradient(circle at 40% 36%, #fff8e3, #f2d7a4 60%, #c8a76c); box-shadow: 0 0 12vmin rgba(244,220,170,.18); }
    .stars i { position: absolute; width: 1.5px; height: 1.5px; border-radius: 50%; background: #f4ecd9; opacity: .6; animation: twinkle 5s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity: .2; } 50% { opacity: .9; } }
    .hills { position: absolute; left: 0; right: 0; top: 46%; height: 18%; background: linear-gradient(180deg, #0a2228, #071a1f); clip-path: polygon(0 42%, 8% 32%, 17% 44%, 26% 26%, 36% 40%, 46% 20%, 57% 38%, 68% 24%, 79% 42%, 89% 30%, 100% 38%, 100% 100%, 0 100%); opacity: .85; }
    .water { position: absolute; left: 0; right: 0; top: 60%; bottom: 0; background: linear-gradient(180deg, rgba(18,51,58,.9), #061418); }
    .ripple { position: absolute; left: 0; right: 0; height: 1px; background: rgba(244,236,217,.12); animation: drift 9s linear infinite; }
    @keyframes drift { from { transform: translateX(-4%); } to { transform: translateX(4%); } }
    .lanterns { position: absolute; inset: 0; pointer-events: none; }
    .lantern { position: absolute; width: 34px; height: 44px; border-radius: 4px 4px 8px 8px; background: linear-gradient(160deg, #ffe4ac, #f0a94f 55%, #c16a24); box-shadow: 0 0 18px rgba(240,173,88,.55), 0 0 44px rgba(240,150,60,.25), inset 0 0 10px rgba(255,240,190,.6); opacity: 0; animation: floatUp 16s linear forwards; }
    .lantern::before { content: ""; position: absolute; inset: 5px 6px 10px; border: 1px solid rgba(120,60,16,.35); border-radius: 2px; }
    .lantern::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 3px; height: 6px; margin-left: -1.5px; background: rgba(240,173,88,.8); }
    .lantern .wish { position: absolute; left: 50%; top: -16px; transform: translateX(-50%); font-family: var(--mono); font-size: 4px; letter-spacing: .08em; color: rgba(244,236,217,.7); white-space: nowrap; text-transform: uppercase; }
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(0) scale(.85); }
      8% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-58vh) translateX(var(--sway, 20px)) scale(1.05); }
    }
    .top { position: absolute; z-index: 6; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: clamp(12px, 2.2vw, 24px) clamp(14px, 3vw, 40px); }
    .brand { font-family: var(--mono); font-size: 5px; letter-spacing: .16em; text-transform: uppercase; color: rgba(244,236,217,.55); line-height: 1.8; }
    .brand b { display: block; font-family: var(--serif); font-size: 16px; letter-spacing: -.01em; text-transform: none; color: var(--cream); font-weight: 400; }
    .meta { font-family: var(--mono); font-size: 5px; letter-spacing: .1em; text-transform: uppercase; color: rgba(244,236,217,.55); text-align: right; line-height: 1.8; }
    .meta b { color: var(--gold); font-weight: 400; }
    .intro { position: absolute; z-index: 5; left: clamp(14px, 3vw, 40px); top: 26%; max-width: 250px; }
    .intro h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(34px, 5.2vw, 58px); line-height: .82; letter-spacing: -.06em; }
    .intro h1 em { display: block; font-style: italic; color: var(--amber); font-size: .92em; }
    .intro p { margin: 12px 0 0; max-width: 190px; font-family: var(--serif); font-size: 11px; line-height: 1.55; color: rgba(244,236,217,.68); }
    .dock { position: absolute; z-index: 7; left: clamp(14px, 3vw, 40px); right: clamp(14px, 3vw, 40px); bottom: clamp(12px, 2vw, 22px); display: flex; align-items: flex-end; gap: 14px; }
    .wish-box { flex: 1; max-width: 420px; background: rgba(6,20,24,.66); border: 1px solid rgba(244,236,217,.2); backdrop-filter: blur(8px); padding: 9px 10px; }
    .wish-box label { display: block; font-family: var(--mono); font-size: 4.5px; letter-spacing: .12em; text-transform: uppercase; color: rgba(244,236,217,.55); margin-bottom: 4px; }
    .wish-row { display: flex; gap: 6px; }
    .wish-box input { flex: 1; min-width: 0; background: transparent; border: 0; border-bottom: 1px solid rgba(244,236,217,.35); color: var(--cream); font-family: var(--serif); font-size: 13px; padding: 2px 0 4px; outline: none; }
    .wish-box input:focus { border-color: var(--amber); }
    .wish-box button { flex: 0 0 auto; border: 1px solid var(--amber); background: var(--amber); color: var(--night); font-family: var(--mono); font-size: 4.5px; letter-spacing: .08em; text-transform: uppercase; padding: 5px 8px; cursor: pointer; }
    .wish-box button:hover { background: var(--gold); border-color: var(--gold); }
    .released { margin-left: auto; text-align: right; font-family: var(--mono); font-size: 4.5px; line-height: 1.8; letter-spacing: .07em; text-transform: uppercase; color: rgba(244,236,217,.55); }
    .released b { display: block; font-family: var(--serif); font-size: 26px; color: var(--gold); letter-spacing: -.02em; }
    .recent { position: absolute; z-index: 5; right: clamp(14px, 3vw, 40px); top: 24%; width: 150px; text-align: right; pointer-events: none; }
    .recent .r { font-family: var(--mono); font-size: 4px; letter-spacing: .05em; line-height: 1.7; color: rgba(244,236,217,.4); text-transform: uppercase; animation: fadeIn .8s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .recent .r b { color: rgba(244,236,217,.7); font-weight: 400; }
    @media (max-width: 700px) {
      .recent { display: none; }
      .intro { top: 20%; }
      .intro p { display: none; }
      .dock { display: block; }
      .wish-box { max-width: none; }
      .released { display: none; }
      .water { top: 64%; }
    }
    @media (max-width: 520px) {
      .top { padding: 10px 11px; }
      .meta { font-size: 4px; }
      .intro { left: 11px; top: 17%; }
      .intro h1 { font-size: 36px; }
      .dock { left: 11px; right: 11px; bottom: 11px; }
      .wish-box input { font-size: 11px; }
      .lantern { width: 26px; height: 34px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="moon"></div>
    <div class="stars" id="stars"></div>
    <div class="hills"></div>
    <div class="water" id="water"></div>
    <div class="lanterns" id="lanterns"></div>
    <div class="top">
      <div class="brand"><b>Lanterns 073</b>Festival on the inner sea / night 073</div>
      <div class="meta">Wind<br><b>Light, offshore</b><br>Water<br><b>Still</b></div>
    </div>
    <div class="intro">
      <h1>Release<em>a wish</em></h1>
      <p>Write it down, set it on the water, and let the current decide what happens next. The lantern does not carry the wish anywhere; it simply carries it away.</p>
    </div>
    <div class="recent" id="recent"></div>
    <div class="dock">
      <div class="wish-box">
        <label for="wishInput">Your wish, if you have one</label>
        <div class="wish-row">
          <input id="wishInput" type="text" maxlength="60" value="For a quiet year, and enough light to read by." spellcheck="false">
          <button type="button" id="release">Release</button>
        </div>
      </div>
      <div class="released">Lanterns released<b id="count">0</b>tonight</div>
    </div>
  </div>
  <script>
    (() => {
      const scene = document.querySelector('.scene');
      const lanterns = document.getElementById('lanterns');
      const countEl = document.getElementById('count');
      const recent = document.getElementById('recent');
      let count = 0;
      // stars
      const stars = document.getElementById('stars');
      for (let i = 0; i < 70; i++) {
        const s = document.createElement('i');
        s.style.left = (Math.random() * 100) + '%';
        s.style.top = (Math.random() * 48) + '%';
        s.style.animationDelay = (Math.random() * 5) + 's';
        s.style.opacity = .2 + Math.random() * .7;
        stars.appendChild(s);
      }
      // water ripples
      const water = document.getElementById('water');
      for (let i = 0; i < 16; i++) {
        const r = document.createElement('div');
        r.className = 'ripple';
        r.style.top = (4 + i * 5.8) + '%';
        r.style.opacity = .25 + Math.random() * .4;
        r.style.animationDelay = (-Math.random() * 7) + 's';
        water.appendChild(r);
      }
      function release(text) {
        const el = document.createElement('div');
        el.className = 'lantern';
        const startX = 12 + Math.random() * 76;
        el.style.left = startX + '%';
        el.style.top = (62 + Math.random() * 16) + '%';
        el.style.setProperty('--sway', (Math.random() * 60 - 30) + 'px');
        el.style.animationDuration = (13 + Math.random() * 8) + 's';
        const wish = document.createElement('span');
        wish.className = 'wish';
        wish.textContent = text.length > 26 ? text.slice(0, 26) + '…' : text;
        el.appendChild(wish);
        lanterns.appendChild(el);
        count++;
        countEl.textContent = count;
        const r = document.createElement('div');
        r.className = 'r';
        r.innerHTML = '<b>“' + text + '”</b><br>released ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        recent.insertBefore(r, recent.firstChild);
        while (recent.children.length > 5) recent.removeChild(recent.lastChild);
        setTimeout(() => el.remove(), 22000);
      }
      document.getElementById('release').addEventListener('click', () => {
        const input = document.getElementById('wishInput');
        const text = input.value.trim() || 'A wish without words.';
        release(text);
        input.value = '';
        input.placeholder = 'Another, if you like.';
      });
      document.getElementById('wishInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('release').click();
      });
      // ambient lanterns
      const ambience = ['A safe crossing.', 'Rain by morning.', 'A letter that arrives.', 'Enough time.', 'A steady hand.'];
      setInterval(() => { if (document.hidden) return; if (Math.random() < .7) release(ambience[Math.floor(Math.random() * ambience.length)]); }, 4200);
      setTimeout(() => release('For a quiet year, and enough light to read by.'), 900);
    })();
  </script>
</body>
</html>
