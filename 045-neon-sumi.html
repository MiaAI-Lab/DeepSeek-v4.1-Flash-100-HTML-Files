<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0d16">
  <meta name="description" content="Neon Sumi — a luminous ink garden painted by hand.">
  <title>Neon Sumi — A Luminous Ink Garden</title>
  <style>
    :root {
      --night: #080b14;
      --ink: #eef0f2;
      --dim: #737c8e;
      --pink: #ff5ea8;
      --cyan: #5ee7ff;
      --violet: #a78bfa;
      --line: rgba(238,240,242,.15);
      --serif: Georgia, "Times New Roman", serif;
      --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
      --mono: "Courier New", Courier, monospace;
    }
    * { box-sizing: border-box; }
    ::selection { background: var(--cyan); color: var(--night); }
    html, body { margin: 0; height: 100%; }
    body { background: var(--night); color: var(--ink); font-family: var(--sans); overflow: hidden; }
    canvas#silk { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; touch-action: none; cursor: crosshair; }
    .fiber { position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: .15; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 4px); }
    .vignette { position: fixed; inset: 0; z-index: 2; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 44%, rgba(3,5,10,.72) 100%); }
    .ui { position: relative; z-index: 3; height: 100vh; min-height: 540px; display: flex; flex-direction: column; padding: 19px clamp(16px, 3.4vw, 48px) 16px; pointer-events: none; }
    .ui button, .ui input { pointer-events: auto; }
    header { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; }
    .brand { font-family: var(--mono); font-size: 7px; letter-spacing: .18em; text-transform: uppercase; color: var(--cyan); line-height: 1.8; }
    .brand b { display: block; font-family: var(--serif); font-size: 17px; font-weight: 400; letter-spacing: -.02em; color: var(--ink); text-transform: none; }
    .head { display: flex; gap: clamp(15px, 3vw, 36px); font-family: var(--mono); font-size: 6px; line-height: 1.9; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); text-align: right; }
    .head b { color: var(--ink); font-weight: 400; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 15px 0 10px; }
    .verse { align-self: flex-end; text-align: right; max-width: 260px; padding-top: 12px; }
    .verse p { margin: 0; font-family: var(--serif); font-style: italic; font-size: clamp(14px, 1.5vw, 19px); line-height: 1.5; color: #d9dfe6; }
    .verse small { display: block; margin-top: 10px; font-family: var(--mono); font-size: 5.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
    .title { margin-top: auto; }
    .kicker { display: flex; align-items: center; gap: 9px; margin: 0 0 10px; font-family: var(--mono); font-size: 7px; letter-spacing: .18em; text-transform: uppercase; color: var(--pink); }
    .kicker::before { content: ""; width: 30px; height: 1px; background: linear-gradient(90deg, var(--pink), var(--cyan)); }
    h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(58px, 10.5vw, 145px); line-height: .7; letter-spacing: -.085em; text-shadow: 0 0 34px rgba(94,231,255,.18); }
    h1 em { display: block; margin-left: clamp(22px, 7vw, 98px); color: transparent; -webkit-text-stroke: 1px var(--pink); font-style: italic; }
    footer { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: end; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 12px; }
    .tools { display: flex; gap: 5px; flex-wrap: wrap; }
    .tools button { border: 1px solid var(--line); background: rgba(8,11,20,.35); color: var(--dim); font: inherit; font-family: var(--mono); font-size: 6px; letter-spacing: .07em; text-transform: uppercase; padding: 7px 8px; cursor: pointer; backdrop-filter: blur(5px); transition: all .2s; }
    .tools button:hover, .tools button.active { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 10px rgba(94,231,255,.2); }
    .sizes { display: flex; gap: 5px; align-items: center; font-family: var(--mono); font-size: 6px; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); }
    .sizes input { width: 68px; accent-color: var(--pink); cursor: ew-resize; }
    .note { text-align: right; font-family: var(--mono); font-size: 6px; line-height: 1.8; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
    .note b { color: var(--ink); font-weight: 400; }
    @media (max-width: 720px) {
      .verse { max-width: 200px; padding-top: 5px; }
      .verse p { font-size: 12px; }
      h1 { font-size: clamp(56px, 16vw, 100px); }
      .head div:nth-child(2) { display: none; }
      footer { grid-template-columns: 1fr auto; }
      .note { display: none; }
      .sizes { display: none; }
    }
    @media (max-width: 520px) {
      .ui { padding: 12px 12px 13px; height: 100svh; }
      .verse p { font-size: 11px; }
      h1 { font-size: clamp(54px, 19vw, 88px); }
      h1 em { margin-left: 5vw; }
      .tools button { padding: 6px 6px; font-size: 5px; }
      footer { padding-top: 8px; margin-top: 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <canvas id="silk" aria-label="Luminous ink painting surface"></canvas>
  <div class="fiber"></div><div class="vignette"></div>
  <div class="ui">
    <header>
      <div class="brand"><b>Neon Sumi</b>Luminous ink garden / 045</div>
      <div class="head"><div>Brush<br><b id="brushRead">6 px</b></div><div>Ink<br><b id="inkRead">Electric cyan</b></div><div>Strokes<br><b id="strokeRead">000</b></div></div>
    </header>
    <main>
      <div class="verse"><p>Painting is only<br>the weather of the hand,<br>briefly made visible.</p><small>— after a note on the studio wall</small></div>
      <div class="title">
        <p class="kicker">A garden painted with light</p>
        <h1>Neon<em>sumi</em></h1>
      </div>
    </main>
    <footer>
      <div class="tools" aria-label="Ink colors"><button class="active" type="button" data-ink="#5ee7ff">Cyan</button><button type="button" data-ink="#ff5ea8">Pink</button><button type="button" data-ink="#a78bfa">Violet</button><button type="button" data-ink="#ffe28a">Ochre</button><button type="button" id="mountain">Add mountains</button><button type="button" id="clear">Clear paper</button></div>
      <div class="sizes">Brush <input id="size" type="range" min="2" max="34" value="6" aria-label="Brush size"><span id="sizeLabel">6</span></div>
      <div class="note"><b>Drag to paint</b>Every stroke fades like ink<br>Nothing here is permanent</div>
    </footer>
  </div>
  <script>
    (() => {
      const canvas = document.getElementById('silk');
      const ctx = canvas.getContext('2d');
      let w, h, dpr, ink = '#5ee7ff', size = 6, drawing = false, strokes = 0;
      let last = null, fadeTimer = 0;
      function resize() {
        const old = document.createElement('canvas');
        old.width = canvas.width; old.height = canvas.height;
        if (canvas.width) old.getContext('2d').drawImage(canvas, 0, 0);
        dpr = Math.min(devicePixelRatio || 1, 2); w = innerWidth; h = innerHeight;
        canvas.width = w * dpr; canvas.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (old.width) {
          ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = .95;
          ctx.drawImage(old, 0, 0, old.width, old.height, 0, 0, canvas.width, canvas.height); ctx.restore();
        }
        seedMountains();
      }
      function seedMountains() {
        ctx.save();
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        const baseY = h * .66;
        const layers = [
          { alpha: .16, color: '#5ee7ff', offset: 0, height: h * .23, width: .9 },
          { alpha: .2, color: '#a78bfa', offset: h * .05, height: h * .17, width: 1.4 },
          { alpha: .26, color: '#ff5ea8', offset: h * .1, height: h * .12, width: 2 }
        ];
        layers.forEach((layer, li) => {
          ctx.beginPath();
          ctx.moveTo(-20, baseY);
          for (let x = -20; x <= w + 20; x += 8) {
            const y = baseY - layer.offset + Math.sin((x / w) * 7 + li * 2) * layer.height * .18 + Math.sin((x / w) * 2.3 + li) * layer.height * .1 - (x > w * .48 && x < w * .58 ? layer.height * .32 : 0);
            ctx.lineTo(x, y);
          }
          ctx.strokeStyle = layer.color; ctx.globalAlpha = layer.alpha; ctx.lineWidth = layer.width;
          ctx.shadowColor = layer.color; ctx.shadowBlur = 16; ctx.stroke();
          ctx.fillStyle = 'rgba(8,11,20,.55)'; ctx.globalAlpha = .5;
          ctx.lineTo(w + 20, h); ctx.lineTo(-20, h); ctx.closePath(); ctx.fill();
        });
        ctx.restore();
      }
      function paint(e) {
        const p = e.touches ? e.touches[0] : e;
        const x = p.clientX, y = p.clientY;
        if (!last) { last = { x, y }; return; }
        const pressure = e.pressure && e.pointerType === 'pen' ? .4 + e.pressure * 1.4 : 1;
        ctx.save();
        ctx.strokeStyle = ink; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.shadowColor = ink; ctx.shadowBlur = 14;
        ctx.globalAlpha = .82;
        ctx.lineWidth = size * pressure * .9;
        ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(x, y); ctx.stroke();
        ctx.globalAlpha = .26; ctx.lineWidth = size * .34;
        ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(x, y); ctx.stroke();
        ctx.restore();
        last = { x, y };
        if (Math.random() > .986) strokes++;
        document.getElementById('strokeRead').textContent = String(strokes).padStart(3, '0');
      }
      function start(e) { drawing = true; last = null; paint(e); }
      function end() { drawing = false; last = null; strokes++; document.getElementById('strokeRead').textContent = String(strokes).padStart(3, '0'); }
      canvas.addEventListener('pointerdown', start);
      canvas.addEventListener('pointermove', (e) => { if (drawing) paint(e); });
      canvas.addEventListener('pointerup', end);
      canvas.addEventListener('pointercancel', end);
      canvas.addEventListener('pointerleave', end);
      document.querySelectorAll('[data-ink]').forEach(button => {
        button.addEventListener('click', () => {
          ink = button.dataset.ink;
          document.querySelectorAll('[data-ink]').forEach(b => b.classList.remove('active'));
          button.classList.add('active');
          document.getElementById('inkRead').textContent = button.textContent + ' ink';
        });
      });
      document.getElementById('size').addEventListener('input', (e) => {
        size = Number(e.target.value);
        document.getElementById('sizeLabel').textContent = size;
        document.getElementById('brushRead').textContent = size + ' px';
      });
      document.getElementById('mountain').addEventListener('click', seedMountains);
      document.getElementById('clear').addEventListener('click', () => {
        ctx.clearRect(0, 0, w, h);
        seedMountains();
        strokes = 0; document.getElementById('strokeRead').textContent = '000';
      });
      addEventListener('resize', resize);
      resize();
    })();
  </script>
</body>
</html>
